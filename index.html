<!-- 静态资源是按网址缓存的，同名文件改了内容也不会自动更新。
     这三行是给支持它们的浏览器（以及部分中间缓存）看的，尽量别缓存这个页面本身。 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<link rel="stylesheet" href="assets/style.css?v=20261016e">

<!-- 手机主屏入口。为什么要这一套，而不是只发 apk：
     国内安卓手机从 2024 年起对未备案的安装包做拦截（华为管这个叫"应用核准"），
     自己签的包必然过不了，用户装的时候会被弹"未备案"。而浏览器把网页加到主屏
     不经过这套校验 —— 这个 App 本来就是一层的浏览器壳，功能全在网页上，
     所以加主屏的体验和装 apk 是一样的，还省掉了提示和重新安装。
     下面这些是让"添加到主屏幕"出来是个正经 App 图标（而不是一个书签缩略图）。 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c2552c">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今天吃什么">

<!-- 版本自检：光给资源加版本号还不够 —— 如果这个 HTML 本身被浏览器缓存了，
     它引用的一直是旧那一套资源，页面就会「看起来修过、其实没修」。
     所以每次加载都悄悄问一次服务端的最新构建号，对不上就带着新版本号重进。
     网址一变浏览器就不会再用缓存，用户不需要手动强刷，点菜的人也一样。 -->
<script>
(function () {
  var BUILD = '20261016e';
  window.__KF_BUILD = BUILD;

  function check() {
    if (!window.fetch) return;
    fetch('version.txt?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (t) {
        t = String(t == null ? '' : t).trim();
        if (!t || t === BUILD) return;
        /* 当前网址已经带着这个版本号了，说明换过了也没用，别再跳，避免打转 */
        if (location.search.indexOf('v=' + t) >= 0) return;
        location.replace(location.pathname + '?v=' + encodeURIComponent(t) + location.hash);
      })
      .catch(function () { /* 自检失败不影响使用 */ });
  }

  setTimeout(check, 600);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>
